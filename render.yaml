services:
  - type: web
    name: sales-prediction-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FRONTEND_ORIGINS
        sync: false
      - key: MODEL_ARTIFACT_URL
        sync: false
